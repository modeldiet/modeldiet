
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Check lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  typecheck:
    name: Mypy (production source)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Type-check production source
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test and demo dependencies
        run: python -m pip install -e ".[test,demo,viz]"

      - name: Run tests
        run: python -m pytest -v

  core-only-visualization:
    name: Core-only visualization optional dependency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install without Plotly
        run: python -m pip install -e ".[test]"
      - name: Verify optional dependency boundary
        run: >-
          python -m pytest -v tests/test_visualization.py
          -k "core_package_and_visualization_namespace or visualization_error_explains_install_extra"

  coverage:
    name: Coverage (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test and demo dependencies
        run: python -m pip install -e ".[test,demo,viz]"

      - name: Run tests with line and branch coverage
        run: >-
          python -m pytest -v
          --cov=modeldiet
          --cov-branch
          --cov-fail-under=80
          --cov-report=term-missing
          --cov-report=html
          --cov-report=xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: warn

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build and validation tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Test wheel installation
        run: |
          python -m venv /tmp/modeldiet-wheel
          /tmp/modeldiet-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/modeldiet-wheel/bin/python -c \
            "import sys, modeldiet.visualization; from modeldiet import profile, ProfileResult; assert 'plotly' not in sys.modules; print('Wheel import successful')"

      - name: Test source distribution installation
        run: |
          python -m venv /tmp/modeldiet-sdist
          /tmp/modeldiet-sdist/bin/python -m pip install \
            "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd /tmp
          /tmp/modeldiet-sdist/bin/python -c \
            "import sys, modeldiet.visualization; from modeldiet import profile, ProfileResult; assert 'plotly' not in sys.modules; print('Source distribution import successful')"
