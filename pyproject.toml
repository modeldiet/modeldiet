[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeldiet"
version = "0.1.0"
description = "Profile inference performance and resource usage of trained models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
demo = ["pandas>=2", "scikit-learn>=1.3", "xgboost>=2.0"]
benchmark = ["pandas>=2", "scikit-learn>=1.3"]
benchmark-xgboost = ["pandas>=2", "scikit-learn>=1.3", "xgboost>=2.0"]
viz = ["plotly>=5.18"]
test = ["pytest>=8", "pytest-cov>=7", "pandas>=2", "build>=1"]
dev = [
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4.1,<3",
    "pip-audit>=2.10.1,<3",
    "pre-commit>=4.7.0,<5",
    "pandas-stubs>=2",
    "types-psutil>=5.9",
    "twine>=7,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
modeldiet-report = "modeldiet.visualization.cli:main"
modeldiet = "modeldiet.visualization.cli:main"
modeldiet-demo = "modeldiet.visualization.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/modeldiet"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "xgboost.*", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["modeldiet"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
